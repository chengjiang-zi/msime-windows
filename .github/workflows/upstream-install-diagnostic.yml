name: Upstream installer diagnostic

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Optional successful Dev build run ID containing the test installer
        required: false
        type: string
  push:
    branches:
      - codex/personal-edition-isolation
    paths:
      - .github/workflows/upstream-install-diagnostic.yml
      - installer/tests/standard-user-task-ci.ps1
      - installer/personal_watchdog_task.iss
      - installer/interactive_user.iss
      - 'installer/tests/uninstall-abort-*'
      - installer/tests/alternate-admin-ci.ps1
      - installer/tests/interactive-user-probe.iss
      - 'tests/alternate-admin-launch/**'

permissions:
  contents: read
  actions: read

jobs:
  limited-no-trust:
    name: Test ordinary preview with a restricted desktop token
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_run_id != '' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-isolation-test-installer
          path: ${{ runner.temp }}/personal-test-package
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
      - name: Install without trusting the development certificate and test limited input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required.' }
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/personal-test-package" -Recurse -File)
          $installers = @($files | Where-Object Name -Like 'ChengjiangIME_Setup_*.exe')
          $certificates = @($files | Where-Object Name -eq 'dev-build.cer')
          if ($installers.Count -ne 1 -or $certificates.Count -ne 1) { throw 'Unexpected test artifact contents.' }
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificates[0].FullName)
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($cert.Subject -ne 'CN=Chengjiang IME Personal Dev Build Code Signing' -or
              -not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint -or
              $signature.Status -eq 'Valid') { throw 'Unexpected or trusted development signature.' }
          function Assert-NotTrusted {
            foreach ($store in @('Cert:\LocalMachine\Root', 'Cert:\LocalMachine\TrustedPublisher',
                                 'Cert:\CurrentUser\Root', 'Cert:\CurrentUser\TrustedPublisher')) {
              if (Get-ChildItem -LiteralPath $store | Where-Object Thumbprint -eq $cert.Thumbprint) {
                throw 'The development certificate is trusted.'
              }
            }
          }
          Assert-NotTrusted
          $languages = Get-WinUserLanguageList
          if (-not ($languages | Where-Object { $_.LanguageTag -like 'zh-*' })) {
            $languages.Add('zh-Hans-CN'); Set-WinUserLanguageList -LanguageList $languages -Force
          }
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Personal setup failed: $($setup.ExitCode)" }
          $desktop = Join-Path $env:RUNNER_TEMP 'limited-desktop.txt'
          & pwsh -STA -File ./installer/tests/interactive-desktop-probe.ps1 -ResultPath $desktop
          if ($LASTEXITCODE -ne 0 -or [IO.File]::ReadAllText($desktop).Trim() -ne 'interactive') { throw 'No interactive desktop.' }
          $build = Join-Path $env:RUNNER_TEMP 'limited-token-build'
          cmake -S tests/limited-token-launch -B $build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Limited launcher configuration failed.' }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Limited launcher build failed.' }
          Get-Process -Name ChengjiangImeWatchdog, ChengjiangImeServer -ErrorAction SilentlyContinue | Stop-Process -Force
          $log = Join-Path $env:RUNNER_TEMP 'limited-input.log'
          & "$build/Release/personal-limited-token-launch.exe" (Get-Command pwsh).Source -NoProfile -File `
            (Join-Path $env:GITHUB_WORKSPACE 'installer/tests/limited-token-smoke.ps1') -DesktopResult $desktop -LogPath $log
          $result = $LASTEXITCODE
          if (Test-Path $log) { Get-Content $log | Write-Host }
          Assert-NotTrusted
          if ($result -ne 0 -or -not (Test-Path $log) -or
              -not ([IO.File]::ReadAllText($log).Contains('PASS: personal TSF committed Chinese text')) -or
              ([IO.File]::ReadAllText($log).Contains('SKIP:'))) {
            throw "Restricted-token input did not complete successfully ($result)."
          }
          Write-Host 'PASS: medium-integrity token with disabled Administrators group committed Chinese text without certificate trust.'
  package-input:
    name: Retest input with a previously built package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_run_id != '' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-isolation-test-installer
          path: ${{ runner.temp }}/personal-test-package
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
      - name: Install in the disposable VM and run input checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required.' }
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/personal-test-package" -Recurse -File)
          $installers = @($files | Where-Object Name -Like 'ChengjiangIME_Setup_*.exe')
          $certificates = @($files | Where-Object Name -eq 'dev-build.cer')
          if ($installers.Count -ne 1 -or $certificates.Count -ne 1) { throw 'Unexpected test artifact contents.' }
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificates[0].FullName)
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($cert.Subject -ne 'CN=Chengjiang IME Personal Dev Build Code Signing' -or
              -not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            throw 'Unexpected development signature.'
          }
          Import-Certificate -FilePath $certificates[0].FullName -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          Import-Certificate -FilePath $certificates[0].FullName -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null
          $languages = Get-WinUserLanguageList
          if (-not ($languages | Where-Object { $_.LanguageTag -like 'zh-*' })) {
            $languages.Add('zh-Hans-CN')
            Set-WinUserLanguageList -LanguageList $languages -Force
          }
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Personal setup failed: $($setup.ExitCode)" }
          $desktop = Join-Path $env:RUNNER_TEMP 'retest-desktop.txt'
          & pwsh -STA -File ./installer/tests/interactive-desktop-probe.ps1 -ResultPath $desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop probe failed.' }
          ./installer/tests/tsf-interactive-smoke.ps1 -DesktopResult $desktop -ProbeMouseCaret
      - name: Upload candidate screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-input-retest-screenshots
          path: ${{ runner.temp }}/personal-tsf-screenshots/**/*.bmp
          if-no-files-found: ignore
  package-without-trust:
    name: Diagnose a previously built package without certificate trust
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package_run_id != '' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: personal-isolation-test-installer
          path: ${{ runner.temp }}/personal-test-package
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
      - name: Test without importing the certificate
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/personal-test-package" -Recurse -File)
          $installers = @($files | Where-Object Name -Like 'ChengjiangIME_Setup_*.exe')
          $certificates = @($files | Where-Object Name -eq 'dev-build.cer')
          if ($installers.Count -ne 1 -or $certificates.Count -ne 1) { throw 'Unexpected test artifact contents.' }
          ./installer/tests/untrusted-uiaccess-ci.ps1 -PersonalInstaller $installers[0].FullName `
            -DevCertificate $certificates[0].FullName -ResultPath "$env:RUNNER_TEMP/untrusted-result.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: untrusted-uiaccess-retest-result
          path: ${{ runner.temp }}/untrusted-result.txt
          if-no-files-found: warn
  alternate-admin:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check desktop user under a different elevated account
        shell: pwsh
        run: ./installer/tests/alternate-admin-ci.ps1
  uninstall-abort:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify uninstaller can fail safely after confirmation
        shell: pwsh
        run: ./installer/tests/uninstall-abort-ci.ps1
  standard-user-task:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check standard-user task registration
        shell: pwsh
        run: ./installer/tests/standard-user-task-ci.ps1
      - name: Verify post-install status reporting
        shell: pwsh
        run: ./installer/tests/postinstall-status-ci.ps1
  inspect:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Inspect upstream data directory in a disposable VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'upstream-diagnostic'
          New-Item -ItemType Directory -Path $root | Out-Null
          $exe = Join-Path $root 'setup.exe'
          $data = Join-Path $root 'data'
          $log = Join-Path $root 'setup.log'
          Invoke-WebRequest -Uri 'https://github.com/metasequoiaime/msime-windows/releases/download/v0.12.0/MetasequoiaIME_Setup_v0.12.0.exe' -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2baf40185ab95b109f2fd42087a1bf90ae1bb0e8298311d17031c4fccc2bb933') { throw 'Upstream installer hash mismatch.' }
          if ((Get-AuthenticodeSignature $exe).Status -ne 'Valid') { throw 'Upstream signature invalid.' }
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DATADIR=`"$data`"", "/LOG=`"$log`"")
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          $state = Get-ItemProperty -LiteralPath 'HKLM:\Software\Metasequoia\MetasequoiaIME' -ErrorAction SilentlyContinue
          Write-Host "Exit: $($process.ExitCode); requested: $data; registered: $($state.DataDir)"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log | Write-Host }
          if ($process.ExitCode -ne 0) { throw 'Upstream installation failed.' }
